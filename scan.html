<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emora · Text to Match</title>
<style>
  :root { --bg:#f2f2f7; --ink:#111; --muted:#8a8a8e; --blue:#0a84ff; --accent:#e0795a; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system, system-ui, sans-serif; min-height:100vh;
         display:flex; flex-direction:column; align-items:center; }
  .note { width:100%; max-width:420px; padding:14px 16px; font-size:13px; color:#6b5a52; background:#fff4ec; border-bottom:1px solid #f0dccd; text-align:center; }
  .phone { width:100%; max-width:420px; flex:1; display:flex; flex-direction:column; background:#fff; }
  .top { padding:14px 16px 10px; text-align:center; border-bottom:1px solid #e5e5ea; background:#f9f9f9; }
  .avatar { width:44px; height:44px; border-radius:50%; margin:0 auto 4px; background:var(--accent); color:#fff;
            display:grid; place-items:center; font-weight:700; }
  .to { font-size:12px; color:var(--muted); }
  .thread { flex:1; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:78%; padding:9px 13px; border-radius:18px; font-size:15px; opacity:0; transform:translateY(6px); transition:.35s; }
  .bubble.show { opacity:1; transform:none; }
  .me { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:5px; }
  .them { align-self:flex-start; background:#e9e9eb; border-bottom-left-radius:5px; }
  .compose { display:flex; gap:8px; align-items:flex-end; padding:10px 12px 18px; border-top:1px solid #e5e5ea; }
  .field { flex:1; border:1px solid #d1d1d6; border-radius:20px; padding:8px 12px; font-size:15px; min-height:38px; }
  .send { width:36px; height:36px; border-radius:50%; border:0; background:var(--blue); color:#fff; font-size:18px; cursor:pointer;
          animation:pulse 1.6s infinite; }
  .send:disabled { background:#c7c7cc; animation:none; cursor:default; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 #0a84ff66 } 50%{ box-shadow:0 0 0 8px #0a84ff00 } }
  .hint { font-size:12px; color:var(--muted); text-align:center; padding:0 16px 12px; }
  .meta { width:100%; max-width:420px; padding:14px 16px 24px; font-size:13px; color:#555; }
  .meta table { width:100%; border-collapse:collapse; margin-top:6px; }
  .meta td { padding:5px 0; border-bottom:1px solid #e5e5ea; }
  .meta td:first-child { color:var(--muted); width:45%; }
</style>
</head>
<body>
<div class="note"><b>Demo.</b> On a real plush, the scan opens your Messages app with this text ready to send.</div>
<div class="phone">
  <div class="top"><div class="avatar">E</div><b>Emora Health</b><div class="to">Text line for <span id="practice"></span></div></div>
  <div class="thread" id="thread"></div>
  <div class="compose">
    <div class="field" id="field"></div>
    <button class="send" id="send" aria-label="Send">↑</button>
  </div>
  <div class="hint" id="hint">Tap send. That's the second tap.</div>
</div>
<div class="meta" id="meta" hidden>
  <b>What Emora receives</b>
  <table>
    <tr><td>Parent phone</td><td>From the text (no form)</td></tr>
    <tr><td>Referring practice</td><td id="m-practice"></td></tr>
    <tr><td>Practice code</td><td id="m-code"></td></tr>
    <tr><td>Next step</td><td>SMS matching follow-up</td></tr>
  </table>
</div>
<script>
  const PRACTICES = { 'demo-peds-01': { name:'Sunny Days Pediatrics', code:'PEDS-01' } };
  const id = new URLSearchParams(location.search).get('p') || 'demo-peds-01';
  const pr = PRACTICES[id] || { name:'Demo Pediatrics', code:id.toUpperCase() };
  const msg = `Hi Emora! ${pr.name} gave us your info. We'd like help finding a therapist for our child. (Ref ${pr.code})`;
  document.getElementById('practice').textContent = pr.name;
  document.getElementById('field').textContent = msg;
  document.getElementById('m-practice').textContent = pr.name;
  document.getElementById('m-code').textContent = pr.code;
  const thread = document.getElementById('thread');
  const bubble = (text, cls) => { const b = document.createElement('div'); b.className = `bubble ${cls}`; b.textContent = text;
    thread.appendChild(b); requestAnimationFrame(() => b.classList.add('show')); };
  const send = document.getElementById('send');
  send.addEventListener('click', () => {
    send.disabled = true; document.getElementById('field').textContent = '';
    document.getElementById('hint').textContent = 'Sent. Emora now has your number and knows who referred you.';
    bubble(msg, 'me');
    setTimeout(() => bubble(`Hi! This is Emora, thanks for reaching out via ${pr.name}. To match your child with the right therapist: how old is your child, and what's been going on?`, 'them'), 1100);
    setTimeout(() => bubble('Reply anytime. Most families are matched within a few days, and we check your insurance for you.', 'them'), 2600);
    setTimeout(() => document.getElementById('meta').hidden = false, 3000);
  });
</script>
</body>
</html>
